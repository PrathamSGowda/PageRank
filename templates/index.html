<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageRank Simulator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <header class="site-header">
    <h1>PageRank Simulator</h1>
  </header>

  <main>
    <!-- Graph editor -->
    <section class="card" id="editor">
      <h2>Graph editor</h2>
      <div class="editor-grid">
        <svg id="graph" viewBox="0 0 600 420" role="img" aria-label="Directed graph of pages">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
              orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#5b6b86" />
            </marker>
          </defs>
          <g id="edges"></g>
          <g id="nodes"></g>
        </svg>

        <div class="controls">
          <div class="control-group">
            <h3>Pages</h3>
            <div class="row">
              <button id="addPage" type="button">Add page</button>
              <select id="removePageSelect" aria-label="Page to remove"></select>
              <button id="removePage" type="button" class="secondary">Remove</button>
            </div>
          </div>

          <div class="control-group">
            <h3>Links</h3>
            <p class="note">Click a page in the graph to select the source, then click another page to link to it. Click
              an arrow to remove it.</p>
          </div>

          <p id="message" class="message" role="status"></p>

          <div class="row">
            <button id="calculate" type="button" class="primary">Calculate PageRank</button>
            <button id="reset" type="button" class="secondary">Reset graph</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Results (hidden until calculated) -->
    <div id="results" hidden>
      <section class="card">
        <h2>PageRank results</h2>
        <div class="table-wrap">
          <table class="results-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Page</th>
                <th>PageRank</th>
                <th>Percentage</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>Matrices</h2>
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="adjacency" role="tab">Adjacency</button>
          <button class="tab" data-tab="transition" role="tab">Transition</button>
          <button class="tab" data-tab="google" role="tab">Google</button>
        </div>
        <p id="matrixNote" class="note"></p>
        <div id="matrixWrap" class="table-wrap"></div>
      </section>
    </div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
